<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrary</title>
</head>
<body>
    <script>
        let cars= ["bmw","creta","tata","thar","scorpio","nexon"];

        for(let i=0; i<=cars.length;i++){
            document.write(cars[i],"<br>")
        }

        let arrary= [10,20,30,40,50,60];
        let sum=0;
         document.write("<ol>")
        for(let i=0;i<=arrary.length;i++){
             document.write("<li> "+ arrary[i] + "</li>");
             sum += arrary[i];
             
        }
          document.write(sum);
          document.write("</ol>")
    </script>
</body>
</html>
