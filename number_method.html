<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number method</title>
</head>
<body>
    <script>
        document.write("number methods <br>");
         var a=Math.round(10.6);//take next decimal >5 
         document.write(" round of value " + a + "<br>");

          var b=Math.round(10.3);// not take next decimal <5
         document.write(" round of value " + b + "<br>");

          var c=Math.trunc(10.9);//round of without decimal keep current value
         document.write(" trunc of value " + c + "<br>");

        var d=Math.ceil(10.1);//round of  decimal takenaxt value
         document.write(" ceil of value " + d + "<br>");
        
         var e=Math.floor(10.55);//round of near rest value
         document.write(" floor of value " + e + "<br>");

         var f=Math.min(1,2,3,4,);//minimum value 
         document.write(" min of value " + f + "<br>");

         var g=Math.sqrt(81);//squre root
         document.write(" sqrt of value " + g + "<br>");

         var h=Math.cbrt(125);//cube
         document.write(" cube of value " + h + "<br>");

         var i=Math.pow(2,4);//rounpower
         document.write(" power of value " + i + "<br>");

         var j=Math.random();//random
         document.write(" random of value " + j + "<br>");
        
         var jj= Math.floor(Math.random()* 10000);
          document.write(" random of value " + jj + "<br>");
        
           var k=Math.PI.toFixed(3);//pi
         document.write(" pi of value " + k + "<br>");

          var l=Math.log(4).toFixed(2);//random
         document.write(" log of value " + l + "<br>");
    </script>
</body>
</html>
