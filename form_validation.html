<!DOCTYPE html>

<body>


    <div class="container border border-dark p-2  m-5 w-50 h-50">
        <form>
            <h1>Form</h1>
            <div class="row">
                <div class="col-sm-3"> <label for="exampleInputtext1" class="form-label"> Name:</label></div>
                <div class="col-sm-9"> <input type="text" class="form-control mb-3" id="exampleInputText1"></div>
                <div class="col-sm-3"> <label for="exampleInputtext1" class="form-label"> Mobile Number:</label></div>
                <div class="col-sm-9"> <input type="text" class="form-control mb-3" id="exampleInputText1"></div>
                <div class="col-sm-3"><label for="exampleInputtext1" class="form-label">Gmail Id:</label></div>
                <div class="col-sm-9"><input type="gmail" class="form-control mb-3" id="exampleInputText1"></div>
                <div class="col-sm-3"><label for="exampleInputtext1" class="form-label">Password:</label></div>
                <div class="col-sm-9"> <input type="password" class="form-control mb-3" id="exampleInputText1"></div>
                <div class="col-sm-3"> <label for="exampleInputtext1" class="form-label"> Confirm Password:</label>
                </div>
                <div class="col-sm-9"> <input type="password" class="form-control mb-3" id="exampleInputText1"></div>

                <div class="col-sm-12 m-2 ">
                <label for="exampleInputtext1" class="form-label me-2">Gender:</label>
                <input type="radio" class="form-check-input ms-3" id="radio1" name="optradio" value="option1" checked>  Male
                <input type="radio" class="form-check-input me-1 ms-3" id="radio2" name="optradio" value="option2" checked>  Female
                <input type="radio" class="form-check-input me-1 ms-3" id="radio3" name="optradio" value="option3" checked>  Others
            </div>

                <div class="col-sm-3"><label for="comment">Message:</label></div>
                <div class="col-sm-3"> <textarea class="form-control" rows="5" id="comment" name="text"></textarea>
                </div>
                <div class="col-sm-12"> <label class="form-check-label mt-3 ">
                        <input class="form-check-input " type="checkbox" name="remember"> I agree to the Terms And
                        Conditions
                    </label></div>
                <div class="col-sm-3"><button type="submit" class="btn btn-primary mt-2 ">Submit</button></div>


            </div>

        </form>
    </div>
