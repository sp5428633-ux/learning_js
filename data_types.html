<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types</title>
</head>
<body>
    <script>
        var a = "ajay";//string
        var b =12.3;//number
        var c = true;  //boolean
        var d = ["html","css",1];  //object  in js array is object 
        var e = { fname:"sagar",lname:"patil"};//object
        var f= null;
        var g;
        function my_function() //function
        {
            return "hello";
        }
        document.write(a,"<br>");
        document.write(typeof(a),"<br>");

        document.write(b,"<br>");
        document.write(typeof(b),"<br>");
        
        document.write(c,"<br>");
        document.write(typeof(c),"<br>");

         document.write(d,"<br>");
        document.write(typeof(d),"<br>");

         document.write(e,"<br>");
        document.write(typeof(e),"<br>");

        
        document.write(typeof(f),"<br>");

        
        document.write(typeof(g),"<br>");
        
    </script>
</body>
</html>
